<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Try-On | Threadz Premium Streetwear</title>
    <meta name="description" content="Endless AI-powered virtual try-on feed. See Threadz streetwear on real models with photorealistic AI previews.">
    <link rel="icon" type="image/png" href="tabicon.png" data-site-image="favicon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Outfit:wght@300;400;600;700&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="site-images.js"></script>
    <style>
        /* ─── Infinite Try-On Feed ───────────────────────────────────── */
        html.infinite-tryon, html.infinite-tryon body {
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        html.infinite-tryon body {
            margin: 0;
            padding: 0;
        }
        .infinite-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            pointer-events: none;
        }
        .infinite-nav > * {
            pointer-events: auto;
        }
        .infinite-nav .nav-logo {
            height: 28px;
            opacity: 0.9;
        }
        .infinite-nav .nav-back {
            color: #fff;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .infinite-nav .nav-back:hover {
            opacity: 1;
        }
        .infinite-nav .nav-brand {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            color: var(--gold);
            text-transform: uppercase;
        }

        /* Feed container */
        .infinite-feed {
            position: fixed;
            inset: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .infinite-feed::-webkit-scrollbar {
            display: none;
        }

        /* Feed card */
        .feed-card {
            position: relative;
            width: 100%;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        .feed-card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        /* Loading shimmer */
        .feed-card-shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, #111 30%, #1a1a1a 50%, #111 70%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .feed-card-shimmer-inner {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 6rem 1.5rem 3rem;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        .feed-card-shimmer-line {
            height: 14px;
            border-radius: 2px;
            background: rgba(255,255,255,0.06);
            margin-bottom: 10px;
            width: 60%;
        }
        .feed-card-shimmer-line:last-child {
            width: 40%;
        }

        /* Overlay info bar */
        .feed-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 5rem 1.5rem 2.5rem;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
            z-index: 2;
        }
        .feed-card-product {
            font-family: var(--font-heading);
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: #fff;
            letter-spacing: 0.04em;
            margin-bottom: 0.3rem;
        }
        .feed-card-price {
            font-family: var(--font-ui);
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--gold);
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }
        .feed-card-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .feed-card-btn {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0.6rem 1.4rem;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .feed-card-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .feed-card-btn-primary {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
        }
        .feed-card-btn-primary:hover {
            background: var(--gold-light);
            border-color: var(--gold-light);
            color: #000;
        }

        /* Right-side action buttons (like, etc) */
        .feed-card-side {
            position: absolute;
            right: 1rem;
            bottom: 10rem;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .feed-card-side-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 1.2rem;
        }
        .feed-card-side-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        .feed-card-side-btn.liked svg {
            fill: #ff3040;
            stroke: #ff3040;
        }
        .feed-card-side-label {
            font-family: var(--font-ui);
            font-size: 0.6rem;
            color: rgba(255,255,255,0.6);
            text-align: center;
            margin-top: -0.4rem;
        }

        /* Status indicator */
        .feed-status {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            font-family: var(--font-ui);
            font-size: 0.65rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.1em;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .infinite-nav {
                padding: 0.75rem 1rem;
            }
            .infinite-nav .nav-brand {
                font-size: 0.9rem;
            }
            .feed-card-overlay {
                padding: 4rem 1rem 1.5rem;
            }
            .feed-card-side {
                right: 0.75rem;
                bottom: 7rem;
            }
            .feed-card-side-btn {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
        }

        .feed-card-model-label {
            font-family: var(--font-ui);
            font-size: 0.6rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.08em;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <nav class="infinite-nav">
        <a href="tryon.html" class="nav-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
            Try-On
        </a>
        <span class="nav-brand">Infinite Feed</span>
        <a href="shop.html" class="nav-back" style="opacity:0.5;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </a>
    </nav>

    <div class="infinite-feed" id="infinite-feed"></div>
    <div class="feed-status" id="feed-status"></div>

    <script src="https://js.puter.com/v2/"></script>
    <script src="cart-data.js"></script>
    <script src="infinite-tryon.js"></script>
</body>
</html>
